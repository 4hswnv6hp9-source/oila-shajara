<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bizning Shajara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#16110c;--card:#251d15;--line:#a67c3d;--ink:#f3e8d2;--mute:#bfae8f;--salmon:#e07a5f;--blue:#5fa8c4;--gold:#e9c46a;--bark:#7a5230}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(900px 480px at 50% 0,#2e2214,var(--bg) 70%);color:var(--ink);font-family:"Fraunces",Georgia,serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{text-align:center;padding:10px 14px 4px}
#bar{display:flex;justify-content:center;gap:6px;margin-bottom:8px}
#bar span{width:14px;height:18px;border-radius:3px}
h1{margin:0;font-size:2rem;line-height:1.1}
.sub{margin:4px 0 8px;font-style:italic;color:var(--mute)}
.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 14px;font-size:.95rem}
.chip b{color:var(--salmon);font-size:1.1rem}
.hint{margin:8px 0 0;font-size:.85rem;color:var(--mute)}
#tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:6px 10px}
#tools button{background:#2c2216;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font:inherit;font-size:.85rem;cursor:pointer}
#wrap{flex:1;min-height:200px;overflow:auto;-webkit-overflow-scrolling:touch}
#scaler{position:relative;margin:0 auto}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
.card{position:absolute;width:132px;height:164px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 4px;cursor:pointer}
.card:focus-visible{outline:2px solid var(--blue)}
.card.me{border-color:var(--gold);box-shadow:0 0 18px rgba(233,196,106,.45)}
.card.sel{border-color:var(--salmon);box-shadow:0 0 0 2px var(--salmon)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:700;color:#fff;margin-bottom:4px}
.nm{font-weight:700;font-size:15px}
.sn{font-size:13.5px}
.ln,.gn{font-size:13px;color:var(--mute)}
.gn{font-weight:700;color:var(--ink);font-size:14px}
.sp{font-size:12px;color:var(--salmon)}
.mu{font-size:12px;font-weight:700;color:var(--gold)}
.pill{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--blue);color:#0d1b22;border:0;border-radius:999px;padding:1px 11px;font:700 12px "Fraunces",Georgia,serif;cursor:pointer}
.ground{position:absolute;border-radius:50%;background:#34261a}
.trunk{position:absolute;width:32px;background:linear-gradient(90deg,#5e3d22,var(--bark),#5e3d22);border-radius:6px 6px 0 0}
#info{margin:6px auto 10px;width:min(92vw,640px);max-height:34vh;overflow:auto;border:2px dashed var(--line);border-radius:18px;padding:12px 16px;text-align:center;line-height:1.55}
#info h2{margin:0 0 4px;font-size:1.4rem}
#info p{margin:2px 0}
.ef{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ef input{width:100%;background:#1b140d;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:16px}
.ef button{grid-column:1/-1;background:var(--salmon);color:#2a120b;border:0;border-radius:999px;padding:9px;font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<header>
  <div id="bar"></div>
  <h1>🌳 Bizning Shajara</h1>
  <p class="sub">Ildizlardan shoxlargacha — oilamiz tarixi</p>
  <div class="chips"><span class="chip">Avlodlar: <b id="ngen"></b></span><span class="chip">Oila aʼzolari: <b id="nmem"></b></span></div>
  <p class="hint">Kartani bosing — pastda ism, familiya va yilni yozing. Ko‘k tugma shoxni ochadi yoki yopadi.</p>
</header>
<div id="tools">
  <button id="bAll">Hammasini ochish</button>
  <button id="bFold">Yig‘ish</button>
  <button id="bCopy">Zaxira nusxasi</button>
  <button id="bPaste">Zaxirani qo‘yish</button>
  <button id="bOut" aria-label="Kichraytirish">−</button>
  <button id="bIn" aria-label="Kattalashtirish">+</button>
</div>
<div id="wrap"><div id="scaler"><div id="stage"></div></div></div>
<div id="info">Kartani bosing — maʼlumoti va yozish maydonlari shu yerda chiqadi.</div>

<script>
/* ===== MAʼLUMOT (ismlarsiz) =====
   y tug‘ilgan yil · d vafot yili (“?” = noma’lum) · s:1 turmush o‘rtog‘i bor
   sx juft haqida qo‘shimcha · me:1 muallif · k farzandlari */
const DATA={y:1890,d:"?",k:[
 {y:1920,d:2012,k:[
  {k:[{},{},{},{}]},
  {k:[{},{},{}]},
  {k:[{},{},{},{}]},
  {k:[{},{},{}]},
  {y:1956,s:1,sx:"25.12.1959 – 18.01.1996",k:[
    {y:1982,s:1,k:[{y:2002},{y:2004},{y:2007}]},
    {y:1984,s:1,k:[{y:2008,me:1},{y:2009},{y:2015}]},
    {s:1,k:[{},{}]}
  ]},
  {k:[{},{}]},
  {}
 ]}
]};
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COL=["#c0553f","#3a7d99","#8a5ca5","#4f9457","#cf9433"];
const SLOT=148, LEVEL=230, CW=132, CH=164;
let S=0.8, sel=null, nodes=[], leaf=0, maxD=0;

(function prep(n,d,p){n.g=d;n.p=p;n.s0=!!n.s;(n.k||[]).forEach(c=>prep(c,d+1,n));})(DATA,0,null);
const all=[];(function f(n){all.push(n);(n.k||[]).forEach(f);})(DATA);
const sub=n=>(n.k||[]).reduce((a,c)=>a+1+sub(c),0);
document.getElementById("ngen").textContent=Math.max(...all.map(n=>n.g))+1;
document.getElementById("nmem").textContent=all.length;
const bar=document.getElementById("bar");
for(let i=0;i<21;i++){const s=document.createElement("span");s.style.background=["#e07a5f","#5fa8c4","#e9c46a"][i%3];bar.appendChild(s);}

const stage=document.getElementById("stage"),scaler=document.getElementById("scaler"),wrap=document.getElementById("wrap"),info=document.getElementById("info");

function render(){
  nodes=[];leaf=0;maxD=0;
  (function place(n){
    nodes.push(n);maxD=Math.max(maxD,n.g);
    if(!n.k||n.c){n.x=leaf++*SLOT+SLOT/2+40;return;}
    n.k.forEach(place);
    n.x=(n.k[0].x+n.k[n.k.length-1].x)/2;
  })(DATA);
  const w=Math.max(leaf*SLOT+80,360),h=maxD*LEVEL+CH+190,base=maxD*LEVEL+70;
  nodes.forEach(n=>n.y0=base-n.g*LEVEL);
  let svg="",html="";
  nodes.forEach(n=>{
    if(n.k&&!n.c)n.k.forEach(c=>{
      const y1=n.y0-16,y2=c.y0+CH,m=(y1+y2)/2;
      svg+=`<path d="M${n.x} ${y1} C${n.x} ${m} ${c.x} ${m} ${c.x} ${y2}" fill="none" stroke="#a67c3d" stroke-width="${Math.max(9-c.g*2,3)}" stroke-linecap="round"/>`;
    });
  });
  html+=`<div class="ground" style="left:${w/2-Math.min(w/2-20,640)}px;width:${Math.min(w-40,1280)}px;top:${h-62}px;height:46px"></div>`;
  html+=`<div class="trunk" style="left:${DATA.x-16}px;top:${base+CH-6}px;height:${h-base-CH-30}px"></div>`;
  nodes.forEach((n,i)=>{
    const Y=esc(n.y||""),life=Y?(n.d!==undefined?`🕊 ${Y}–${esc(n.d)}`:`🎂 ${Y}`):"";
    html+=`<div class="card${n.me?" me":""}${sel===n?" sel":""}" tabindex="0" aria-label="${esc((n.n||"")+" "+(n.g+1)+"-avlod")}" data-i="${i}" style="left:${n.x-CW/2}px;top:${n.y0}px">`
     +(n.k&&n.k.length?`<button class="pill" aria-label="Shoxni ochish yoki yopish">${n.c?"▾":"▴"} ${n.k.length}</button>`:"")
     +`<div class="av" style="background:${COL[Math.min(n.g,4)]}">${n.n?esc([...n.n][0].toUpperCase()):"👤"}</div>`
     +(n.n?`<div class="nm">${esc(n.n)}</div>`:"")+(n.f?`<div class="sn">${esc(n.f)}</div>`:"")
     +`<div class="gn">${n.g+1}-avlod</div>`+(life?`<div class="ln">${life}</div>`:"")
     +(n.s?`<div class="sp">💍 ${typeof n.s==="string"?esc(n.s):"juft"}</div>`:"")+(n.me?`<div class="mu">⭐ Muallif</div>`:"")+`</div>`;
  });
  stage.style.width=w+"px";stage.style.height=h+"px";
  stage.innerHTML=`<svg width="${w}" height="${h}" style="position:absolute;left:0;top:0">${svg}</svg>`+html;
  zoom();
}
function zoom(){
  const w=parseFloat(stage.style.width),h=parseFloat(stage.style.height);
  scaler.style.width=w*S+"px";scaler.style.height=h*S+"px";stage.style.transform=`scale(${S})`;
}
function show(n){
  sel=n;
  const full=[n.n,n.f].filter(Boolean).map(esc).join(" ");
  let t=`<h2>${full||(n.g+1)+"-avlod"}${n.me?" · ⭐ Muallif":""}</h2>`;
  if(full)t+=`<p>${n.g+1}-avlod</p>`;
  if(n.y)t+=`<p>Tug‘ilgan yili: ${esc(n.y)}</p>`;
  if(n.d!==undefined)t+=`<p>Vafoti: ${n.d==="?"?"noma’lum":esc(n.d)}</p>`;
  if(n.s)t+=`<p>Turmush o‘rtog‘i${typeof n.s==="string"?": "+esc(n.s):" bor"}${n.sx?" ("+esc(n.sx)+")":""}</p>`;
  if(n.k&&n.k.length)t+=`<p>Farzandlari: ${n.k.length} ta</p>`;
  const c=sub(n);if(c)t+=`<p>Jami avlodi: ${c} kishi</p>`;
  t+=`<div class="ef"><input id="fn" placeholder="Ism" maxlength="40" autocomplete="off"><input id="ff" placeholder="Familiya" maxlength="40" autocomplete="off"><input id="fy" placeholder="Tug‘ilgan yili" maxlength="10" inputmode="numeric" autocomplete="off"><input id="fd" placeholder="Vafot yili (ixtiyoriy)" maxlength="10" autocomplete="off"><input id="fs" placeholder="Turmush o‘rtog‘ining ismi" maxlength="40" autocomplete="off" style="grid-column:1/-1"><button id="fb">Saqlash</button></div>`;
  info.innerHTML=t;
  const $=id=>document.getElementById(id);
  $("fn").value=n.n||"";$("ff").value=n.f||"";$("fy").value=n.y||"";$("fd").value=n.d||"";$("fs").value=typeof n.s==="string"?n.s:"";
  $("fb").onclick=()=>{
    const v=id=>$(id).value.trim();
    n.ed=1;n.n=v("fn")||undefined;n.f=v("ff")||undefined;n.y=v("fy")||undefined;n.d=v("fd")||undefined;n.s=v("fs")||(n.s0?1:undefined);
    saveEdits();render();show(n);
  };
  document.querySelectorAll(".card").forEach(e=>e.classList.toggle("sel",nodes[+e.dataset.i]===n));
}
stage.addEventListener("click",e=>{
  const c=e.target.closest(".card");if(!c)return;
  const n=nodes[+c.dataset.i];
  if(e.target.closest(".pill")){n.c=!n.c;render();return;}
  show(n);
});
stage.addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ")return;
  const c=e.target.closest(".card");if(!c)return;
  e.preventDefault();show(nodes[+c.dataset.i]);
});
document.getElementById("bAll").onclick=()=>{all.forEach(n=>n.c=false);render();};
document.getElementById("bFold").onclick=()=>{all.forEach(n=>n.c=n.g>=2);render();};
document.getElementById("bIn").onclick=()=>{S=Math.min(S+.15,1.4);zoom();};
document.getElementById("bOut").onclick=()=>{S=Math.max(S-.15,.35);zoom();};

const KEY="shajara-edits-v1",FIELDS=["n","f","y","d","s"];
function saveEdits(){
  const m={};
  all.forEach((n,i)=>{if(n.ed){m[i]={};FIELDS.forEach(k=>{if(n[k]!==undefined&&n[k]!=="")m[i][k]=n[k];});}});
  try{localStorage.setItem(KEY,JSON.stringify(m));}catch(e){}
  return m;
}
(function loadEdits(){
  try{
    const m=JSON.parse(localStorage.getItem(KEY)||"{}");
    Object.keys(m).forEach(i=>{
      const n=all[+i];if(!n)return;
      FIELDS.forEach(k=>{if(m[i][k]!==undefined)n[k]=m[i][k];else delete n[k];});
      if(!n.s&&n.s0)n.s=1;
      n.ed=1;
    });
  }catch(e){}
})();
document.getElementById("bCopy").onclick=async()=>{
  const j=JSON.stringify(saveEdits());
  try{await navigator.clipboard.writeText(j);alert("Nusxalandi");}catch(e){prompt("Shu matnni nusxalab oling:",j);}
};
document.getElementById("bPaste").onclick=()=>{
  const j=prompt("Zaxira matnini qo‘ying:");if(!j)return;
  try{JSON.parse(j);localStorage.setItem(KEY,j);location.reload();}catch(e){alert("Matn noto‘g‘ri.");}
};

render();
wrap.scrollLeft=(wrap.scrollWidth-wrap.clientWidth)/2;
wrap.scrollTop=wrap.scrollHeight;
</script>
</body>
</html>
